<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FedChat - Pro Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PAJ KONEKSYON -->
    <div class="glass-container active" id="authScreen">
        <div class="auth-content">
            <div class="logo-container" style="text-align: center; margin-bottom: 20px;">
                <svg width="150" height="40" viewBox="0 0 150 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 20 L25 5 L40 20 L25 35 Z" fill="url(#gradientAuth)"/>
                    <text x="50" y="28" font-family="'Poppins', sans-serif" font-weight="bold" font-size="28" fill="#ffffff">Fed<tspan fill="#00ffcc">Chat</tspan></text>
                    <defs>
                        <linearGradient id="gradientAuth" x1="10" y1="5" x2="40" y2="35" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#00ffcc"/>
                            <stop offset="1" stop-color="#0088cc"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            
            <h2 style="text-align: center; font-size: 18px; margin-bottom: 20px;">Konekte nan espas ou</h2>
            
            <div class="input-group">
                <input type="text" id="idInput" placeholder="Antre ID ou">
            </div>
            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="Modpas ou">
            </div>
            
            <button class="btn-primary" id="loginBtn">Konekte</button>
            
            <p class="switch-text">Ou pa gen kont? <span id="switchBtn">Kreye youn</span></p>
        </div>
    </div>

    <!-- PAJ CHAT LA -->
    <div class="glass-container" id="mainApp">
        <header class="chat-header">
            <div class="logo-container">
                <svg width="130" height="35" viewBox="0 0 150 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 20 L25 5 L40 20 L25 35 Z" fill="url(#gradientMain)"/>
                    <text x="50" y="28" font-family="'Poppins', sans-serif" font-weight="bold" font-size="24" fill="#ffffff">Fed<tspan fill="#00ffcc">Chat</tspan></text>
                    <defs>
                        <linearGradient id="gradientMain" x1="10" y1="5" x2="40" y2="35" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#00ffcc"/>
                            <stop offset="1" stop-color="#0088cc"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <div class="header-actions">
                <button class="pro-btn-icon" title="Apèl Odyo"><i class="fa-solid fa-phone"></i></button>
                <button class="pro-btn-icon" title="Apèl Videyo"><i class="fa-solid fa-video"></i></button>
                <button class="pro-btn-icon" id="logoutBtn" title="Dekonekte"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </header>

        <div class="chat-body-wrapper">
            <aside class="contacts-sidebar">
                <h3><i class="fa-solid fa-users"></i> Kontak</h3>
                <div class="user-item">
                    <div class="status-indicator status-online"></div>
                    <span>Valentia</span>
                </div>
            </aside>

            <main class="chat-main-column">
                <div class="messages-area" id="messagesArea">
                    <div class="system-message">Koneksyon sekirize. Kòmanse pale.</div>
                </div>

                <!-- Panèl Stickers -->
                <div class="stickers-panel" id="stickersPanel">
                    <img src="https://cdn-icons-png.flaticon.com/128/4786/4786093.png" class="sticker-item" alt="Sticker">
                    <img src="https://cdn-icons-png.flaticon.com/128/4786/4786105.png" class="sticker-item" alt="Sticker">
                    <img src="https://cdn-icons-png.flaticon.com/128/4786/4786071.png" class="sticker-item" alt="Sticker">
                </div>

                <div class="input-area">
                    <button class="pro-btn-icon" id="toggleStickers" title="Stickers"><i class="fa-solid fa-face-smile"></i></button>
                    
                    <label for="imageUpload" class="pro-btn-icon" title="Voye Foto">
                        <i class="fa-solid fa-image"></i>
                    </label>
                    <input type="file" id="imageUpload" accept="image/*" style="display: none;">
                    
                    <button class="pro-btn-icon" id="recordVoiceBtn" title="Voye Vwa"><i class="fa-solid fa-microphone"></i></button>
                    
                    <input type="text" id="messageInput" placeholder="Ekri yon mesaj...">
                    
                    <button class="send-btn" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </main>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
